{{- if and .Values.tls.enabled .Values.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "hushdns.fullname" . }}
  labels:
    {{- include "hushdns.labels" . | nindent 4 }}
spec:
  secretName: {{ include "hushdns.tlsSecret" . }}
  dnsNames:
    {{- required "tls.certManager.dnsNames needs at least one name" .Values.tls.certManager.dnsNames | toYaml | nindent 4 }}
  issuerRef:
    name: {{ required "tls.certManager.issuerRef.name is required" .Values.tls.certManager.issuerRef.name }}
    kind: {{ .Values.tls.certManager.issuerRef.kind }}
    group: cert-manager.io
{{- end }}
