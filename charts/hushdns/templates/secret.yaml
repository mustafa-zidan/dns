{{- if not .Values.existingConfigSecret }}
{{- $token := include "hushdns.apiToken" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hushdns.fullname" . }}
  labels:
    {{- include "hushdns.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ $token | quote }}
  hushdns.toml: |
    {{- include "hushdns.configToml" (dict "root" . "token" $token) | nindent 4 }}
{{- end }}
