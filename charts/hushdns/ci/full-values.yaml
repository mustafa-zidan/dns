# Turns on every optional part of the chart, for CI.
service:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.53
tls:
  enabled: true
  certManager:
    enabled: true
    issuerRef: {name: letsencrypt}
    dnsNames: [dns.example.com]
api:
  corsOrigins: ["https://other.example.com"]
  users:
    - {name: admin, role: admin, password_hash: "$argon2id$v=19$m=19456,t=2,p=1$yFZ9cpUP4IEpiilyj4ejow$Uc1PuJTVp/tfkd0xARbKcZRtTO/sTTSKkaVSo0Ll5cU"}
    - {name: family, password_hash: "$argon2id$v=19$m=19456,t=2,p=1$yFZ9cpUP4IEpiilyj4ejow$Uc1PuJTVp/tfkd0xARbKcZRtTO/sTTSKkaVSo0Ll5cU"}
  tokens:
    - {name: home-assistant, role: viewer, hash: "4cb34e791dcc6294435eb9e31d2e8e568e955ba189199d82567d07db721a690c"}
  ingress:
    enabled: true
    className: nginx
    hosts: [api.dns.example.com]
    tls: [{secretName: api-tls, hosts: [api.dns.example.com]}]
dashboard:
  image: {digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
  ingress:
    enabled: true
    hosts: [dns.example.com]
    tls: [{secretName: dash-tls, hosts: [dns.example.com]}]
config:
  server: {timezone: Europe/Berlin}
  clients:
    - name: kids
      addresses: ["192.168.1.20", "192.168.1.64/28"]
      denylist: ["youtube.com"]
      schedules:
        - days: ["sun", "mon"]
          from: "21:00"
          to: "07:00"
          block_all: true
