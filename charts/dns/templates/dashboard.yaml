{{- if .Values.dashboard.enabled }}
{{- $d := .Values.dashboard }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dns.dashboardName" . }}
  labels:
    {{- include "dns.labels" . | nindent 4 }}
    {{- include "dns.dashboardSelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ $d.replicaCount }}
  selector:
    matchLabels:
      {{- include "dns.dashboardSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dns.labels" . | nindent 8 }}
        {{- include "dns.dashboardSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: {{ include "dns.image" (list $d.image .) }}
          imagePullPolicy: {{ $d.image.pullPolicy }}
          env:
            - name: DNS_API_URL
              value: {{ include "dns.apiUrl" . | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with $d.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # nginx renders its config at start and keeps its pid and caches
          # in /tmp, so those stay writable.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with $d.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dns.dashboardName" . }}
  labels:
    {{- include "dns.labels" . | nindent 4 }}
spec:
  type: {{ $d.service.type }}
  selector:
    {{- include "dns.dashboardSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $d.service.port }}
      targetPort: http
      protocol: TCP
{{- if $d.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dns.dashboardName" . }}
  labels:
    {{- include "dns.labels" . | nindent 4 }}
  {{- with $d.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $d.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $d.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $d.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dns.dashboardName" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
{{- end }}
