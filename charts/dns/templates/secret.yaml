{{- if not .Values.existingConfigSecret }}
{{- $token := include "dns.apiToken" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dns.fullname" . }}
  labels:
    {{- include "dns.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ $token | quote }}
  dns.toml: |
    {{- include "dns.configToml" (dict "root" . "token" $token) | nindent 4 }}
{{- end }}
