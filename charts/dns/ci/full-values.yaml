# Turns on every optional part of the chart, for CI.
service:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.53
tls:
  enabled: true
  certManager:
    enabled: true
    issuerRef: {name: letsencrypt}
    dnsNames: [dns.example.com]
api:
  corsOrigins: ["https://other.example.com"]
  ingress:
    enabled: true
    className: nginx
    hosts: [api.dns.example.com]
    tls: [{secretName: api-tls, hosts: [api.dns.example.com]}]
dashboard:
  image: {digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
  ingress:
    enabled: true
    hosts: [dns.example.com]
    tls: [{secretName: dash-tls, hosts: [dns.example.com]}]
config:
  server: {timezone: Europe/Berlin}
  clients:
    - name: kids
      addresses: ["192.168.1.20", "192.168.1.64/28"]
      denylist: ["youtube.com"]
      schedules:
        - days: ["sun", "mon"]
          from: "21:00"
          to: "07:00"
          block_all: true
