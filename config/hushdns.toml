# Example configuration. Every key is optional; the values shown are the defaults
# unless noted.

[server]
# Each address is served over both UDP and TCP.
listen = ["0.0.0.0:53"]
tcp_idle_timeout_secs = 10
# Time zone for client schedules, such as "Europe/Berlin". (Default: the
# system's zone, from the TZ variable or /etc/localtime; UTC in the image.)
# timezone = "Europe/Berlin"

[tls]
# DNS-over-TLS and DNS-over-HTTPS for your own devices. Off until you list an
# address. Both need a PEM certificate chain and private key for the name your
# devices connect to.
# cert_file = "/etc/hushdns/tls/fullchain.pem"
# key_file = "/etc/hushdns/tls/privkey.pem"
# dot_listen = ["0.0.0.0:853"]
# doh_listen = ["0.0.0.0:443"]
doh_path = "/dns-query"
# Check the certificate files this often and load them if they changed.
reload_interval_secs = 3600

[upstream]
# Tried in order until one answers. Encrypted transports are the default, so
# your ISP (or anyone on the path) cannot see or tamper with your lookups.
#
#   DNS-over-TLS:   "tls://1.1.1.1#cloudflare-dns.com"  (IP, then the name on its certificate)
#                   "tls://dns.quad9.net"               (hostname, looked up via bootstrap)
#   DNS-over-HTTPS: "https://cloudflare-dns.com/dns-query"
#   Plain DNS:      "1.1.1.1", "udp://1.1.1.1:53", "tcp://1.1.1.1"
servers = ["tls://1.1.1.1#cloudflare-dns.com", "tls://9.9.9.9#dns.quad9.net"]
# Plain DNS servers used only to look up the hostnames of encrypted upstreams.
bootstrap = ["1.1.1.1", "9.9.9.9"]
timeout_ms = 3000

[cache]
enabled = true
max_entries = 10000
min_ttl = 0
max_ttl = 86400
# Used for NXDOMAIN / NODATA answers that carry no SOA record.
negative_ttl = 300

[blocking]
enabled = true
# "nxdomain", "null_ip" (0.0.0.0 / ::) or "refused".
mode = "nxdomain"
blocked_ttl = 60
# URLs or file paths. Hosts files, plain domain lists and adblock-style
# "||domain^" rules are understood. (Default: no lists.)
lists = [
  "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",
  "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt",
]
# Extra domains to block, subdomains included.
denylist = []
# Domains that are never blocked, subdomains included.
allowlist = []
# Re-download lists this often. 0 disables refreshing.
refresh_interval_secs = 86400

# Rules for specific devices or networks, matched by source address. Repeat
# the block for each group. (Default: no groups.)
# [[clients]]
# name = "kids"
# # Addresses and networks. The most specific match wins.
# addresses = ["192.168.1.20", "192.168.1.64/28"]
# # Apply the shared [blocking] lists too.
# blocklists = true
# # Blocked for this group only, subdomains included.
# denylist = ["youtube.com"]
# # Never blocked for this group. Wins over everything else.
# allowlist = []
# # Extra blocklists for this group, refreshed with the shared ones.
# lists = ["https://example.com/social-media.txt"]
#
# # A time window with extra rules. Repeat for more windows.
# [[clients.schedules]]
# # Days the window starts on. (Default: every day.)
# days = ["sun", "mon", "tue", "wed", "thu"]
# # HH:MM in server.timezone. A window that ends before it starts runs past
# # midnight.
# from = "21:00"
# to = "07:00"
# # Block everything except the group's allowlist,
# block_all = true
# # or only these domains.
# denylist = []

[api]
# HTTP API for stats and runtime control (see the docs for endpoints).
enabled = true
# Keep this on loopback unless you set up sign-in below. In Docker, use
# "0.0.0.0:8053" with sign-in, and publish the port to reach it from the host.
listen = "127.0.0.1:8053"
# Web origins allowed to call the API from a browser, such as the address
# you open the dashboard on. Exact matches only. (Default: none.)
# cors_origins = ["http://localhost:8080"]
# A session from signing in ends after this long without a request (default:
# 8 hours), and after session_max_secs in any case (default: 7 days).
# session_idle_secs = 28800
# session_max_secs = 604800
# A single admin token, sent as "Authorization: Bearer <token>". API tokens
# below can be read-only and are stored hashed. (Default: unset.)
# token = "change-me"

# Accounts for signing in to the dashboard. Make a password hash with
# `hushdns hash-password`. A viewer can look; an admin can also change
# settings. (Default: none.)
# [[api.users]]
# name = "admin"
# role = "admin"
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."

# API tokens for scripts, made with `hushdns new-token <name> --role viewer`,
# which prints the token and this entry. (Default: none.)
# [[api.tokens]]
# name = "home-assistant"
# role = "viewer"
# hash = "<64 hex digits>"

[stats]
# Count queries per domain for the "top domains" lists. In memory only, never
# written to disk. Set to false to keep no record of which names were looked up.
top_domains = true
max_tracked_domains = 10000
