# Example configuration. Every key is optional; the values shown are the defaults
# unless noted.

[server]
# Each address is served over both UDP and TCP.
listen = ["0.0.0.0:53"]
tcp_idle_timeout_secs = 10

[upstream]
# Tried in order until one answers. Encrypted transports are the default, so
# your ISP (or anyone on the path) cannot see or tamper with your lookups.
#
#   DNS-over-TLS:   "tls://1.1.1.1#cloudflare-dns.com"  (IP, then the name on its certificate)
#                   "tls://dns.quad9.net"               (hostname, looked up via bootstrap)
#   DNS-over-HTTPS: "https://cloudflare-dns.com/dns-query"
#   Plain DNS:      "1.1.1.1", "udp://1.1.1.1:53", "tcp://1.1.1.1"
servers = ["tls://1.1.1.1#cloudflare-dns.com", "tls://9.9.9.9#dns.quad9.net"]
# Plain DNS servers used only to look up the hostnames of encrypted upstreams.
bootstrap = ["1.1.1.1", "9.9.9.9"]
timeout_ms = 3000

[cache]
enabled = true
max_entries = 10000
min_ttl = 0
max_ttl = 86400
# Used for NXDOMAIN / NODATA answers that carry no SOA record.
negative_ttl = 300

[blocking]
enabled = true
# "nxdomain", "null_ip" (0.0.0.0 / ::) or "refused".
mode = "nxdomain"
blocked_ttl = 60
# URLs or file paths. Hosts files, plain domain lists and adblock-style
# "||domain^" rules are understood. (Default: no lists.)
lists = [
  "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",
  "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt",
]
# Extra domains to block, subdomains included.
denylist = []
# Domains that are never blocked, subdomains included.
allowlist = []
# Re-download lists this often. 0 disables refreshing.
refresh_interval_secs = 86400

[api]
# HTTP API for stats and runtime control (see the README for endpoints).
enabled = true
# Keep this on loopback unless you set a token. In Docker, use "0.0.0.0:8053"
# with a token and publish the port to reach it from the host.
listen = "127.0.0.1:8053"
# When set, requests need "Authorization: Bearer <token>". (Default: unset.)
# token = "change-me"
# Serve the web dashboard at http://<listen>/. (Default: true.)
dashboard = true

[stats]
# Count queries per domain for the "top domains" lists. In memory only, never
# written to disk. Set to false to keep no record of which names were looked up.
top_domains = true
max_tracked_domains = 10000
