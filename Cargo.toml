[package]
name = "dns"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "An ad-blocking, privacy-focused DNS server"
repository = "https://github.com/mustafa-zidan/dns"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
hickory-proto = "0.26.3"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }
ipnet = "2.12.2"
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rustls = "0.23"
rustls-platform-verifier = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
