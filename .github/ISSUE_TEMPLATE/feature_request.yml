name: Feature request
description: Suggest something new.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
