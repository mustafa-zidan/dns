name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Checks every upstream transport against real public resolvers.
  live-upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --test live -- --ignored

  # Keeps the rust-version in Cargo.toml honest.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Rust version goes in the toolchain input: Dependabot reads a ref
      # like "@1.89" as an action version and tries to bump it.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets

  # Lints the Helm chart and checks the dns.toml it renders with the server's
  # own config parser.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: helm lint --strict charts/dns
      - run: helm lint --strict charts/dns -f charts/dns/ci/full-values.yaml
      - run: cargo build --locked
      - name: Check the rendered config
        run: |
          for values in "" "-f charts/dns/ci/full-values.yaml"; do
            helm template t charts/dns $values --show-only templates/secret.yaml \
              | yq -r '.stringData["dns.toml"]' > "$RUNNER_TEMP/dns.toml"
            target/debug/dns --check-config --config "$RUNNER_TEMP/dns.toml"
          done
