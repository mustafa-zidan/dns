[package]
name = "hushdns-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "Load generator and fake upstream for benchmarking hushdns"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
